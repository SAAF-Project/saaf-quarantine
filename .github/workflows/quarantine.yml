name: saaf-quarantine

on:
  workflow_call:
    inputs:
      path:
        description: Directory to check, relative to the repository root
        type: string
        default: "."

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SAAF-Project/saaf-quarantine
          path: .saaf-quarantine
          persist-credentials: false
      - name: Check prompts for unquarantined documents
        env:
          TARGET: ${{ inputs.path }}
        run: python3 .saaf-quarantine/quarantine_check.py --format github "$TARGET"
