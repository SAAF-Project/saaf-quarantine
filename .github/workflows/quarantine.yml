name: saaf-quarantine
on:
  workflow_call:
    inputs:
      path:
        description: Existing source directory or file, relative to the caller checkout
        type: string
        default: '.'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: caller
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SAAF-Project/saaf-quarantine
          ref: be3f4c6349cbae95f9c3c27dac1071878b4eb1b7
          path: checker
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Inspect caller source with the pinned, isolated checker
        env:
          TARGET: ${{ inputs.path }}
        run: python -I checker/run_check.py caller "$TARGET"
